name: Test Kyverno CLI installation with invalid version (error handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          release: not-a-valid-version
          install-dir: /tmp/kyverno-invalid
        continue-on-error: true
      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid version format"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid version 'not-a-valid-version'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
