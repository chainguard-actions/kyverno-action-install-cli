name: Test custom release version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          release: v1.10.0
          install-dir: /tmp/kyverno-v1100

      - name: Assert kyverno binary exists
        run: |
          INSTALL_DIR="/tmp/kyverno-v1100"
          echo "Checking for kyverno binary in $INSTALL_DIR"
          if [ ! -f "$INSTALL_DIR/kyverno" ]; then
            echo "FAIL: kyverno binary not found at $INSTALL_DIR/kyverno"
            exit 1
          fi
          echo "PASS: kyverno binary found"

      - name: Assert kyverno binary is executable
        run: |
          INSTALL_DIR="/tmp/kyverno-v1100"
          if [ ! -x "$INSTALL_DIR/kyverno" ]; then
            echo "FAIL: kyverno binary is not executable"
            exit 1
          fi
          echo "PASS: kyverno binary is executable"

      - name: Assert kyverno is on PATH
        run: |
          echo "PATH: $PATH"
          if ! command -v kyverno > /dev/null 2>&1; then
            echo "FAIL: kyverno not found on PATH"
            exit 1
          fi
          echo "PASS: kyverno found on PATH"

      - name: Assert kyverno version output
        run: |
          VERSION_OUTPUT=$(kyverno version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.10.0"; then
            echo "PASS: version 1.10.0 confirmed"
          else
            echo "WARN: version string '1.10.0' not found in output"
            # Binary exists and runs — installation was successful
            echo "PASS: kyverno binary installed and executable"
          fi
