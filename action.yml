# action.yml
name: kyverno-cli-installer
author: kyverno
description: Installs kyverno CLI and includes it in your path
branding:
  icon: package
  color: orange
# This is pinned to the last major release, we have to bump it for each action version.
inputs:
  release:
    description: Kyverno CLI release version to be installed
    required: false
    default: v1.10.3
  install-dir:
    description: Where to install the kyverno CLI binary
    required: false
    default: $HOME/.kyverno
  use-sudo:
    description: Set to true if install-dir location requires sudo privs
    required: false
    default: 'false'
  verify:
    description: Set to true if you want to verify the archive with cosign
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - shell: bash
      env:
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_USE_SUDO: ${{ inputs.use-sudo }}
        INPUT_VERIFY: ${{ inputs.verify }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        #!/bin/bash

        shopt -s expand_aliases

        if [ -z "$NO_COLOR" ]; then
          alias log_info="echo -e \"\033[1;32mINFO\033[0m:\""
          alias log_error="echo -e \"\033[1;31mERROR\033[0m:\""
        else
          alias log_info="echo \"INFO:\""
          alias log_error="echo \"ERROR:\""
        fi

        set -e

        mkdir -p "$INPUT_INSTALL_DIR"

        # main
        if [[ "$INPUT_RELEASE" == "main" ]]; then
          log_info "installing via 'go install' from its main version"
          GOBIN=$(go env GOPATH)/bin
          go install github.com/kyverno/kyverno/cmd/cli/kubectl-kyverno@main
          ln -s "$GOBIN/kubectl-kyverno" "$INPUT_INSTALL_DIR/kyverno"
          exit 0
        fi

        trap "popd >/dev/null" EXIT

        pushd "$INPUT_INSTALL_DIR" > /dev/null

        case "$RUNNER_OS" in
          Linux)
            case "$RUNNER_ARCH" in
              X64)
                release_archive='linux_x86_64.tar.gz'
                ;;

              ARM64)
                release_archive='linux_arm64.tar.gz'
                ;;

              *)
                log_error "unsupported architecture $RUNNER_ARCH"
                exit 1
                ;;
            esac
            ;;

          macOS)
            case "$RUNNER_ARCH" in
              X64)
                release_archive='darwin_x86_64.tar.gz'
                ;;

              ARM64)
                release_archive='darwin_arm64.tar.gz'
                ;;

              *)
                log_error "unsupported architecture $RUNNER_ARCH"
                exit 1
                ;;
            esac
            ;;

          Windows)
            case "$RUNNER_ARCH" in
              X64)
                release_archive='windows_x86_64.zip'
                ;;

              *)
                log_error "unsupported architecture $RUNNER_ARCH"
                exit 1
                ;;
            esac
            ;;

          *)
            log_error "unsupported os $RUNNER_OS"
            exit 1
            ;;
        esac

        SUDO=
        if [[ "$INPUT_USE_SUDO" == "true" ]] && command -v sudo >/dev/null; then
          SUDO=sudo
        fi

        semver='^v([0-9]+\.){0,2}(\*|[0-9]+)(-?r?c?)(\.[0-9]+)$'
        if [[ "$INPUT_RELEASE" =~ $semver ]]; then
          log_info "Custom version '$INPUT_RELEASE' requested"
        else
          log_error "Unable to validate requested version: '$INPUT_RELEASE'"
          exit 1
        fi

        release_archive="kyverno-cli_${INPUT_RELEASE}_${release_archive}"
        release_archive_url="https://github.com/kyverno/kyverno/releases/download/${INPUT_RELEASE}/${release_archive}"

        log_info "Downloading Kyverno CLI version '$INPUT_RELEASE'...\n      ${release_archive_url}"
        $SUDO curl -sL "${release_archive_url}" -o "${release_archive}"

        if [[ "$INPUT_VERIFY" == "true" ]]; then
          $SUDO curl -sL "${release_archive_url}.sig" -o "${release_archive}.sig"
          $SUDO curl -sL "${release_archive_url}.pem" -o "${release_archive}.pem"

          cosign verify-blob \
            --certificate "${release_archive}.pem" \
            --signature "${release_archive}.sig" \
            --certificate-identity="https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/${INPUT_RELEASE}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${release_archive}"

          $SUDO rm "${release_archive}.pem"
          $SUDO rm "${release_archive}.sig"
        fi

        case "$RUNNER_OS" in
          Linux)
            $SUDO tar -xvf "${release_archive}" kyverno
            ;;

          macOS)
            $SUDO tar -xvf "${release_archive}" kyverno
            ;;

          Windows)
            $SUDO unzip "${release_archive}" kyverno.exe
            ;;

          *)
            log_error "unsupported os $RUNNER_OS"
            exit 1
            ;;
        esac

        $SUDO rm "${release_archive}"
        $SUDO chmod +x kyverno

        log_info "Installation complete!"
    - if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      shell: bash
      env:
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        safe=$(printf '%s' "$INPUT_INSTALL_DIR" | tr -d '\n\r')
        echo "$safe" >> "$GITHUB_PATH"
    - if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      env:
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        $safe = $env:INPUT_INSTALL_DIR -replace "`r|`n", ""
        $safe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
